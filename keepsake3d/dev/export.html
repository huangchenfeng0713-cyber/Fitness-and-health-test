<!doctype html><meta charset="utf-8"><title>模型导出验证</title><style>body{margin:0;background:#111;color:#eee;font:13px monospace}iframe{border:0;width:100vw;height:80vh}pre{white-space:pre-wrap}</style><iframe src="../"></iframe><pre>正在导出收藏模型…</pre><script type="module">
const f=document.querySelector('iframe'),out=document.querySelector('pre'),report={checks:[],errors:[]};
try{
for(let i=0;i<180&&!f.contentWindow.__app;i++)await new Promise(r=>setTimeout(r,250));
const a=f.contentWindow.__app;if(!a?.modules.plush||!a?.modules.magnet)throw Error('Model load failed');
a.renderer.setAnimationLoop(null);a.modules.plush.reset();a.modules.magnet.reset();a.step(120);
for(const [which,name,part] of [['plush','plush-body.glb','body'],['plush','plush-chain-tag.glb',null],['magnet','magnet.glb','item'],['magnet','magnet-packaged.glb',null]]){
const bytes=await a.saveGLB(which,name,part);report.checks.push({name,bytes,pass:bytes>100000});out.textContent=JSON.stringify(report,null,2);
}
}catch(e){report.errors.push(e.stack||String(e));}
await fetch('http://127.0.0.1:8876/save?name=export-report.json',{method:'POST',body:JSON.stringify(report,null,2)});out.textContent=JSON.stringify(report,null,2);
</script>
