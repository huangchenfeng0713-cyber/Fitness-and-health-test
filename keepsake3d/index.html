<canvas id="c" tabindex="0" aria-label="可旋转和放大的 3D 藏品"></canvas>
<header class="topbar"><button id="openGallery" class="nav-button" aria-label="展示台" aria-controls="gallery" aria-expanded="false"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor"><rect x="2" y="2" width="6" height="6"/><rect x="12" y="2" width="6" height="6"/><rect x="2" y="12" width="6" height="6"/><rect x="12" y="12" width="6" height="6"/></svg>展示台</button><div class="brand">珍 藏<small>PRIVATE COLLECTION</small></div><div class="spacer"></div><button id="returnItem" class="nav-button" hidden>放回展示</button><button id="openDetails" class="nav-button icon" aria-label="藏品详情与操作说明" aria-controls="details" aria-expanded="false"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor"><circle cx="10" cy="10" r="7.5"/><path d="M10 9v5M10 5.5v1"/></svg></button></header>
<div id="status" aria-live="polite">轻点藏品，拿近一点</div><div id="touchMark" hidden></div><footer class="caption"><div id="itemIndex" class="eyebrow">OBJECT 01 / 02</div><h1 id="itemName">毛绒挂件</h1><p id="itemMaterial">短绒织物 · 珠链 · 纸质吊牌</p><p class="gesture-hint">单指旋转 · 双指放大 · 长按轻触</p></footer>
<section id="gallery" class="overlay" role="dialog" aria-modal="true" aria-labelledby="galleryTitle" hidden><header><div><span class="eyebrow">THE COLLECTION</span><h2 id="galleryTitle">我的珍藏</h2><p class="intro">选一件，慢慢看。</p></div><button id="closeGallery" class="nav-button icon" aria-label="关闭展示台">×</button></header><div class="gallery-grid">
