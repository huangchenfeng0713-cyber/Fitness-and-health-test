<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数据与证明互动课堂</title>
<meta name="description" content="北师大版（2024）八年级上册数学 第六章《数据的分析》与第七章《命题与证明》互动教学课件">
<style>
/* ---- styles/base.css ---- */
/* ============================================================
   数据与证明互动课堂 · 基础层
   方格纸底色 + 两章各一种主色：
     第六章 数据的分析  数据青  #0A8A7D
     第七章 命题与证明  证明蓝  #3E4FC6
   荧光黄 #FFD84D 用于关键词划线；朱批红 #E04B3A 用于强调与纠错。
   ============================================================ */

:root {
  --fs: 1;
  --sans: "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei UI", "Microsoft YaHei",
          "Noto Sans SC", "Noto Sans CJK SC", "Source Han Sans SC", "WenQuanYi Micro Hei",
          "WenQuanYi Zen Hei", system-ui, sans-serif;
  --kai: "Kaiti SC", "STKaiti", "KaiTi", "KaiTi_GB2312", "AR PL UKai CN", "LXGW WenKai", var(--sans);
  --num: "Bahnschrift", "DIN Alternate", "DIN Pro", "Barlow", "Roboto Condensed", "Segoe UI", var(--sans);
  --math: "Times New Roman", "STIX Two Text", "Cambria", "Liberation Serif", "Noto Serif", "DejaVu Serif", serif;

  /* 纸与墨 */
  --bg: #F2F4F7;
  --grid: rgba(52, 84, 132, .075);
  --surface: #FFFFFF;
  --surface-2: #F7F9FB;
  --surface-3: #EEF2F6;
  --ink: #17202B;
  --ink-2: #465163;
  --ink-3: #778296;
  --line: #DCE2EA;
  --line-2: #C3CCD8;
  --shadow: 0 1px 2px rgba(20, 32, 52, .06), 0 6px 18px rgba(20, 32, 52, .07);
  --shadow-lg: 0 12px 40px rgba(20, 32, 52, .16);

  /* 章节主色 */
  --c6: #0A8A7D;
  --c6-strong: #07695F;
  --c6-tint: #E2F3F0;
  --c7: #3E4FC6;
  --c7-strong: #2E3CA3;
  --c7-tint: #E7E9FB;
  --accent: #2F3E55;
  --accent-strong: #1D2A3D;
  --accent-tint: #E8ECF2;
  --on-accent: #FFFFFF;

  /* 语义色 */
  --marker: #FFD84D;
  --marker-soft: rgba(255, 216, 77, .55);
  --red: #E04B3A;
  --red-tint: #FCE9E6;
  --green: #17945A;
  --green-tint: #E1F4EA;
  --amber: #C98309;
  --amber-tint: #FBF0D9;

  /* 数据系列（甲乙丙丁） */
  --s1: #2F6FDE;
  --s2: #E07A1F;
  --s3: #1F9E68;
  --s4: #A04BD6;
  --s1-tint: rgba(47, 111, 222, .14);
  --s2-tint: rgba(224, 122, 31, .15);
  --s3-tint: rgba(31, 158, 104, .15);
  --s4-tint: rgba(160, 75, 214, .14);

  /* 角的配色 */
  --a1: #E8742A;
  --a2: #2F6FDE;
  --a3: #1F9E68;
  --a4: #C9408A;

  --radius: 14px;
  --radius-s: 9px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --ease-io: cubic-bezier(.65, 0, .35, 1);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D121A;
    --grid: rgba(140, 170, 220, .06);
    --surface: #151C27;
    --surface-2: #19212D;
    --surface-3: #202A38;
    --ink: #E8EDF4;
    --ink-2: #B2BCCB;
    --ink-3: #808B9C;
    --line: #283243;
    --line-2: #37445A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 22px rgba(0, 0, 0, .3);
    --shadow-lg: 0 16px 44px rgba(0, 0, 0, .5);
    --c6: #3CC8B6;
    --c6-strong: #6FE0D0;
    --c6-tint: #11302D;
    --c7: #8D99FF;
    --c7-strong: #B3BBFF;
    --c7-tint: #1D2244;
    --accent: #B9C4D6;
    --accent-strong: #DDE4EE;
    --accent-tint: #222C3A;
    --on-accent: #0D121A;
    --marker: #E8C23A;
    --marker-soft: rgba(232, 194, 58, .42);
    --red: #FF6F5E;
    --red-tint: #3A1C19;
    --green: #3FD18D;
    --green-tint: #123224;
    --amber: #F0B545;
    --amber-tint: #3A2C10;
    --s1: #6FA3FF;
    --s2: #FFA257;
    --s3: #4CD49A;
    --s4: #CB8BFF;
    --s1-tint: rgba(111, 163, 255, .18);
    --s2-tint: rgba(255, 162, 87, .18);
    --s3-tint: rgba(76, 212, 154, .18);
    --s4-tint: rgba(203, 139, 255, .18);
    --a1: #FF9A55;
    --a2: #6FA3FF;
    --a3: #4CD49A;
    --a4: #F07BB9;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0D121A;
  --grid: rgba(140, 170, 220, .06);
  --surface: #151C27;
  --surface-2: #19212D;
  --surface-3: #202A38;
  --ink: #E8EDF4;
  --ink-2: #B2BCCB;
  --ink-3: #808B9C;
  --line: #283243;
  --line-2: #37445A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 22px rgba(0, 0, 0, .3);
  --shadow-lg: 0 16px 44px rgba(0, 0, 0, .5);
  --c6: #3CC8B6;
  --c6-strong: #6FE0D0;
  --c6-tint: #11302D;
  --c7: #8D99FF;
  --c7-strong: #B3BBFF;
  --c7-tint: #1D2244;
  --accent: #B9C4D6;
  --accent-strong: #DDE4EE;
  --accent-tint: #222C3A;
  --on-accent: #0D121A;
  --marker: #E8C23A;
  --marker-soft: rgba(232, 194, 58, .42);
  --red: #FF6F5E;
  --red-tint: #3A1C19;
  --green: #3FD18D;
  --green-tint: #123224;
  --amber: #F0B545;
  --amber-tint: #3A2C10;
  --s1: #6FA3FF;
  --s2: #FFA257;
  --s3: #4CD49A;
  --s4: #CB8BFF;
  --s1-tint: rgba(111, 163, 255, .18);
  --s2-tint: rgba(255, 162, 87, .18);
  --s3-tint: rgba(76, 212, 154, .18);
  --s4-tint: rgba(203, 139, 255, .18);
  --a1: #FF9A55;
  --a2: #6FA3FF;
  --a3: #4CD49A;
  --a4: #F07BB9;
  color-scheme: dark;
}

/* 章节主色切换 */
.ch-6 { --accent: var(--c6); --accent-strong: var(--c6-strong); --accent-tint: var(--c6-tint); }
.ch-7 { --accent: var(--c7); --accent-strong: var(--c7-strong); --accent-tint: var(--c7-tint); }

/* ---------- reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html {
  height: 100%;
  font-size: calc(var(--fs) * clamp(15px, 1.15vmin + 9.5px, 26px));
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; line-height: 1.25; }
ul, ol { margin: 0; padding: 0; }
kbd {
  display: inline-block; min-width: 1.6em; padding: 0 .35em; margin: 0 .1em;
  border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px;
  font-family: var(--num); font-size: .78em; line-height: 1.5; text-align: center;
  background: var(--surface); color: var(--ink-2);
}
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--marker-soft); }

/* ---------- 数学排版 ---------- */
.v, .m { font-family: var(--math); font-style: italic; letter-spacing: .01em; }
.m-up { font-family: var(--math); font-style: normal; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.ov { position: relative; display: inline-block; }
.ov::before {
  content: ""; position: absolute; left: .2em; right: -.04em; top: .06em;
  border-top: .07em solid currentColor;
}
.frac {
  display: inline-flex; flex-direction: column; align-items: center;
  vertical-align: middle; line-height: 1.15; margin: 0 .12em; font-size: .92em;
}
.frac > span { display: block; padding: 0 .25em; text-align: center; }
.frac > span:first-child { border-bottom: .07em solid currentColor; padding-bottom: .1em; }
.frac > span:last-child { padding-top: .1em; }
.sqrt { display: inline-flex; align-items: stretch; }
.sqrt::before { content: "√"; font-family: var(--math); margin-right: .02em; }
.sqrt > span { border-top: .07em solid currentColor; padding: 0 .12em; }
.formula {
  font-family: var(--math); font-size: 1.12em; line-height: 2.1;
  display: block; text-align: center; overflow-x: auto; overflow-y: hidden; padding: .1em 0;
}
.formula .frac { margin: 0 .3em; }
.formula .eq { margin: 0 .25em; }
.formula .cn { font-family: var(--sans); font-style: normal; font-size: .88em; }
sub, sup { font-size: .68em; line-height: 0; }

/* 关键词荧光划线：进入视野时从左到右划过 */
.hl {
  background-image: linear-gradient(transparent 58%, var(--marker-soft) 58%, var(--marker-soft) 92%, transparent 92%);
  background-repeat: no-repeat;
  background-size: 0% 100%;
  transition: background-size .9s var(--ease) .25s;
  font-weight: 700;
  padding: 0 .08em;
}
.slide.is-active .hl, .hl.on { background-size: 100% 100%; }
.slide.is-active .step-hidden .hl { background-size: 0% 100%; }

.muted { color: var(--ink-3); }
.ink2 { color: var(--ink-2); }
.red { color: var(--red); }
.green { color: var(--green); }
.accent { color: var(--accent); }
.kai { font-family: var(--kai); }
.nowrap { white-space: nowrap; }
.small { font-size: .82em; }
.tiny { font-size: .72em; }
.b { font-weight: 700; }

/* ---------- 应用骨架 ---------- */
.app {
  position: relative;
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
}

.topbar {
  position: relative; z-index: 20;
  display: flex; align-items: center; gap: .7rem;
  padding: calc(.42rem + env(safe-area-inset-top, 0px)) 1rem .42rem;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex; align-items: center; gap: .55rem;
  color: var(--ink); text-decoration: none; flex: none;
}
.brand-mark {
  width: 2.05rem; height: 2.05rem; border-radius: 9px; display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent);
  transition: background-color .5s var(--ease);
}
.brand-mark svg { width: 72%; height: 72%; fill: currentColor; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.brand-mark svg rect { stroke: none; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text b { font-size: .98rem; letter-spacing: .06em; }
.brand-text small { font-size: .64rem; color: var(--ink-3); letter-spacing: .04em; }

.crumbs {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: .35rem;
  font-size: .76rem; color: var(--ink-2);
  white-space: nowrap; overflow: hidden;
  padding-left: .8rem; border-left: 1px solid var(--line);
}
.crumbs span { overflow: hidden; text-overflow: ellipsis; }
.crumbs .sep { color: var(--ink-3); flex: none; }
.crumbs .ch-tag {
  flex: none; padding: .05rem .5rem; border-radius: 99px;
  background: var(--accent-tint); color: var(--accent-strong); font-weight: 700;
}

.tools { display: flex; align-items: center; gap: .25rem; flex: none; }
.icon-btn, .tool-btn, .nav-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
  border: 1px solid transparent; background: transparent; color: var(--ink-2);
  border-radius: 10px; padding: .38rem .55rem; min-height: 2.2rem;
  font-size: .8rem; line-height: 1;
  transition: background-color .2s, color .2s, border-color .2s, transform .15s;
}
.icon-btn { width: 2.3rem; padding: 0; }
.icon-btn:hover, .tool-btn:hover, .nav-btn:hover { background: var(--surface-3); color: var(--ink); }
.icon-btn:active, .tool-btn:active, .nav-btn:active { transform: scale(.96); }
.tool-btn.on { background: var(--accent-tint); color: var(--accent-strong); box-shadow: inset 0 0 0 1px var(--accent); }
.tool-btn.accent { background: var(--accent); color: var(--on-accent); }
.ico { width: 1.15rem; height: 1.15rem; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

.timer-chip {
  font-family: var(--num); font-size: .95rem; font-weight: 600; letter-spacing: .04em;
  padding: .2rem .6rem; border-radius: 99px; background: var(--amber-tint); color: var(--amber);
  font-variant-numeric: tabular-nums;
}
.timer-chip.done { background: var(--red); color: #fff; animation: pulseChip 1s ease-in-out infinite; }
@keyframes pulseChip { 50% { transform: scale(1.08); } }

/* 舞台：方格纸 */
.stage {
  position: relative; overflow: hidden;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 1.6rem 1.6rem;
  background-position: -1px -1px;
}

.dock {
  position: relative; z-index: 20;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: .9rem;
  padding: .4rem 1rem calc(.4rem + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
}
.nav-btn { padding: .45rem .9rem; font-size: .85rem; font-weight: 600; border-color: var(--line); }
.nav-btn.next { background: var(--accent); border-color: var(--accent); color: var(--on-accent); order: 4; }
.nav-btn.next:hover { background: var(--accent-strong); color: var(--on-accent); }
.nav-btn[disabled] { opacity: .4; pointer-events: none; }
.dock-info {
  display: flex; align-items: center; gap: .7rem; font-size: .76rem; color: var(--ink-3);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.step-info { color: var(--accent-strong); font-weight: 600; }
.step-info:empty { display: none; }
.page-info { font-family: var(--num); }

.progress { display: flex; align-items: center; gap: 3px; height: 1.6rem; min-width: 0; }
.progress .seg {
  position: relative; height: .42rem; border-radius: 99px; background: var(--surface-3);
  overflow: hidden; cursor: pointer; border: 0; padding: 0; min-width: 6px;
  transition: height .2s var(--ease);
}
.progress .seg:hover { height: .7rem; }
.progress .seg i {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0;
  background: var(--seg-c, var(--accent)); border-radius: inherit;
  transition: width .45s var(--ease);
}
.progress .seg.c6 { --seg-c: var(--c6); }
.progress .seg.c7 { --seg-c: var(--c7); }
.progress .seg.c0 { --seg-c: var(--ink-3); }

/* 目录抽屉 */
.toc {
  position: fixed; z-index: 60; top: 0; bottom: 0; left: 0;
  width: min(25rem, 88vw);
  display: flex; flex-direction: column;
  background: var(--surface); box-shadow: var(--shadow-lg);
  transform: translateX(-104%); transition: transform .38s var(--ease);
  padding-top: env(safe-area-inset-top, 0px);
}
.toc.open { transform: none; }
.toc-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: .7rem .9rem .5rem 1.2rem; border-bottom: 1px solid var(--line);
}
.toc-head b { font-size: 1.05rem; letter-spacing: .1em; }
.toc-body { flex: 1; overflow: auto; padding: .4rem .6rem 1rem; overscroll-behavior: contain; }
.toc-foot { padding: .6rem 1rem calc(.6rem + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); font-size: .72rem; color: var(--ink-3); }
.toc-ch { margin-top: .8rem; }
.toc-ch > h3 {
  display: flex; align-items: center; gap: .5rem;
  font-size: .82rem; letter-spacing: .08em; color: var(--ink-3); padding: .3rem .6rem;
}
.toc-ch > h3 i { width: .6rem; height: .6rem; border-radius: 3px; background: var(--dot, var(--ink-3)); }
.toc-sec { margin: .15rem 0 .5rem; }
.toc-sec > .toc-sec-title {
  display: flex; gap: .5rem; align-items: baseline; font-weight: 700; font-size: .9rem;
  padding: .35rem .6rem; color: var(--ink);
}
.toc-sec-title .no { font-family: var(--num); color: var(--dot, var(--accent)); }
.toc-lesson { font-size: .7rem; color: var(--ink-3); padding: .25rem .6rem .1rem 1.9rem; letter-spacing: .05em; }
.toc-link {
  display: flex; gap: .55rem; align-items: baseline; width: 100%;
  padding: .32rem .6rem .32rem 1.9rem; border: 0; border-radius: 8px; background: transparent;
  text-align: left; font-size: .8rem; color: var(--ink-2); line-height: 1.4;
}
.toc-link:hover { background: var(--surface-3); color: var(--ink); }
.toc-link.cur { background: var(--accent-tint); color: var(--accent-strong); font-weight: 700; }
.toc-link .k { flex: none; font-size: .66rem; padding: .02rem .35rem; border-radius: 5px; background: var(--surface-3); color: var(--ink-3); }
.toc-link.cur .k { background: var(--surface); color: var(--accent-strong); }

.scrim {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 55; background: rgba(10, 16, 26, .38);
  animation: fadeIn .3s var(--ease);
}
@keyframes fadeIn { from { opacity: 0; } }

.popover {
  position: fixed; z-index: 70; right: 1rem; top: 3.4rem;
  width: min(19rem, calc(100vw - 2rem));
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); padding: .9rem 1rem 1rem;
  display: flex; flex-direction: column; gap: .7rem;
  animation: popIn .25s var(--ease);
}
@keyframes popIn { from { opacity: 0; transform: translateY(-6px) scale(.98); } }
.popover > b { font-size: .9rem; }
.popover p { font-size: .74rem; }
.timer-big { font-family: var(--num); font-size: 2.6rem; text-align: center; font-weight: 600; letter-spacing: .04em; font-variant-numeric: tabular-nums; }

.toast {
  position: fixed; z-index: 80; left: 50%; bottom: 4.6rem; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: .5rem 1rem; border-radius: 99px;
  font-size: .82rem; box-shadow: var(--shadow-lg); animation: popIn .25s var(--ease);
  max-width: calc(100vw - 2rem);
}

/* 画笔层 */
.pen-canvas {
  position: fixed; z-index: 40; left: 0; top: 0; width: 100%; height: 100%;
  touch-action: none; cursor: crosshair;
}
.pen-canvas.passive { pointer-events: none; }
.pen-canvas.erasing { cursor: cell; }
.pen-bar {
  position: fixed; z-index: 45; left: 50%; bottom: 4.4rem; transform: translateX(-50%);
  display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; justify-content: center;
  max-width: calc(100vw - 1.5rem);
  padding: .4rem .55rem; border-radius: 16px; background: var(--surface);
  border: 1px solid var(--line); box-shadow: var(--shadow-lg);
  animation: popIn .25s var(--ease);
}
.pen-colors, .pen-sizes { display: flex; gap: .3rem; align-items: center; padding-right: .4rem; border-right: 1px solid var(--line); }
.swatch {
  width: 1.7rem; height: 1.7rem; border-radius: 50%; border: 2px solid var(--surface);
  background: var(--sw); box-shadow: 0 0 0 1.5px var(--line-2); padding: 0;
}
.swatch.on { box-shadow: 0 0 0 2.5px var(--ink); }
.pen-sizes button {
  width: 1.9rem; height: 1.9rem; border-radius: 9px; border: 1px solid transparent;
  background: transparent; display: grid; place-items: center; padding: 0;
}
.pen-sizes button i { width: var(--d); height: var(--d); border-radius: 50%; background: var(--ink-2); }
.pen-sizes button.on { background: var(--surface-3); border-color: var(--line); }

/* ---------- 响应式 ---------- */
@media (max-width: 1180px) {
  .tool-btn span { display: none; }
  .tool-btn { padding: .38rem .5rem; }
}
@media (max-width: 860px) {
  .crumbs { display: none; }
  .brand-text small { display: none; }
  .topbar { gap: .4rem; padding-left: .6rem; padding-right: .6rem; }
  .tools { margin-left: auto; }
  #btnFont { display: none; }
  .dock { grid-template-columns: auto minmax(0, 1fr) auto; gap: .6rem; padding-left: .6rem; padding-right: .6rem; }
  .dock-info { display: none; }

}
@media (max-width: 520px) {

}

@media (prefers-reduced-motion: reduce) {

  .toc, .hl { transition: none; }
}

/* ---- styles/components.css ---- */
/* ============================================================
   数据与证明互动课堂 · 组件层
   ============================================================ */

/* ---------- 幻灯片骨架 ---------- */
.slide {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0;
  overflow-x: hidden; overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.slide:not(.is-active) { visibility: hidden; pointer-events: none; }
.slide.is-leaving { visibility: visible; }
.slide-inner {
  min-height: 100%;
  max-width: 96rem; margin: 0 auto;
  display: flex; flex-direction: column; gap: .9rem;
  padding: 1rem 1.6rem 1.2rem;
}
.slide-head { display: flex; flex-direction: column; gap: .3rem; flex: none; }
@media (min-width: 901px) {
  .slide-inner { height: 100%; }
}
.eyebrow {
  display: flex; flex-wrap: wrap; align-items: center; gap: .1rem .55rem;
  font-size: .74rem; color: var(--ink-3); letter-spacing: .06em;
}
.eyebrow .sec-no {
  font-family: var(--num); font-weight: 700; color: var(--accent); letter-spacing: .02em;
  font-size: .86rem;
}
.title-row { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
.title-row h2 { font-size: 1.62rem; font-weight: 800; letter-spacing: .02em; color: var(--ink); }
.kind {
  flex: none; font-size: .72rem; font-weight: 700; letter-spacing: .08em;
  padding: .18rem .55rem .16rem; border-radius: 7px;
  color: var(--accent-strong); background: var(--accent-tint);
  border: 1px solid var(--accent);
}
.kind.k-practice { color: var(--red); background: var(--red-tint); border-color: var(--red); }
.kind.k-extend { color: var(--amber); background: var(--amber-tint); border-color: var(--amber); }
.kind.k-read { color: var(--amber); background: var(--amber-tint); border-color: var(--amber); }

.slide-body { flex: 1; min-height: 0; display: grid; gap: 1.2rem; align-items: stretch; }
.layout-split { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
.layout-split.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.layout-split.text-wide { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); }
.layout-split.lab-wide { grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); }
.layout-full { grid-template-columns: minmax(0, 1fr); }
.layout-center { grid-template-columns: minmax(0, 1fr); justify-items: center; }
.layout-center > * { margin: auto 0; }
.col { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: .8rem; }
.col > * { flex-shrink: 0; }
.col.center { justify-content: center; }
.col.scroll { overflow: auto; padding-right: .2rem; }

/* ---------- 分步显示 ---------- */
[data-step] {
  transition: opacity .5s var(--ease), transform .5s var(--ease), filter .5s var(--ease);
}
.step-hidden {
  opacity: 0 !important;
  transform: translateY(10px);
  filter: blur(2px);
  pointer-events: none;
}
.step-ghost { opacity: .18 !important; filter: none; transform: none; }
.step-now { animation: stepGlow 1.6s var(--ease); }
@keyframes stepGlow {
  0% { box-shadow: 0 0 0 0 var(--marker-soft); }
  30% { box-shadow: 0 0 0 6px var(--marker-soft); }
  100% { box-shadow: 0 0 0 0 transparent; }
}

/* ---------- 卡片与知识框 ---------- */
.panel {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 1rem 1.15rem;
  min-width: 0;
}
.panel.tight { padding: .7rem .85rem; }
.panel.flat { box-shadow: none; background: var(--surface-2); }
.panel.lab { display: flex; flex-direction: column; gap: .6rem; flex: 1 1 0%; min-height: 18rem; }
.panel.lab > * { flex-shrink: 0; }
.panel.lab > .fig, .panel.lab > .grow-fig { flex: 1 1 0%; min-height: 10rem; }
.panel-title {
  display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
  font-weight: 700; font-size: .9rem; color: var(--ink);
}
.panel-title .hint { font-weight: 400; font-size: .72rem; color: var(--ink-3); margin-left: auto; }

.box {
  position: relative; border-radius: 12px; padding: 1.15rem 1rem .8rem;
  margin-top: .55rem;
  background: var(--surface); border: 1px solid var(--line-2);
}
.box > .tag {
  position: absolute; top: -.72rem; left: .8rem;
  font-size: .72rem; font-weight: 800; letter-spacing: .12em;
  padding: .12rem .6rem; border-radius: 6px;
  background: var(--surface); border: 1px solid var(--line-2); color: var(--ink-2);
}
.box p + p { margin-top: .45rem; }
.box.def { background: var(--accent-tint); border-color: var(--accent); }
.box.def > .tag { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.box.thm { background: var(--surface); border: 1.5px solid var(--accent); box-shadow: inset 0 3px 0 var(--accent-tint); }
.box.thm > .tag { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); }
.box.thm .short { margin-top: .4rem; font-weight: 700; color: var(--accent-strong); }
.box.fact { background: var(--amber-tint); border-color: var(--amber); }
.box.fact > .tag { background: var(--amber); border-color: var(--amber); color: #fff; }
.box.ex > .tag { background: var(--ink); border-color: var(--ink); color: var(--bg); letter-spacing: .05em; }
.box.practice { background: var(--red-tint); border-color: var(--red); }
.box.practice > .tag { background: var(--red); border-color: var(--red); color: #fff; }
.box.think { border-style: dashed; background: var(--surface-2); }
.box.think > .tag { color: var(--accent-strong); border-color: var(--accent); border-style: solid; }
.box.note { background: var(--red-tint); border-color: var(--red); border-style: dashed; }
.box.note > .tag { color: var(--red); border-color: var(--red); }
.box.read { background: var(--amber-tint); border-color: var(--amber); }
.box.read > .tag { color: var(--amber); border-color: var(--amber); }

.lead { font-size: 1.02rem; color: var(--ink); line-height: 1.75; }
.text p { line-height: 1.75; }
.qlist { list-style: none; display: flex; flex-direction: column; gap: .45rem; counter-reset: q; }
.qlist > li { position: relative; padding-left: 2rem; line-height: 1.65; counter-increment: q; }
.qlist > li::before {
  content: "（" counter(q) "）"; position: absolute; left: -.35rem; top: 0;
  color: var(--accent-strong); font-weight: 700; font-size: .92em; letter-spacing: -.12em;
}
.dots { list-style: none; display: flex; flex-direction: column; gap: .4rem; }
.dots > li { position: relative; padding-left: 1.05rem; line-height: 1.65; }
.dots > li::before {
  content: ""; position: absolute; left: .1rem; top: .68em; width: .42rem; height: .42rem;
  border-radius: 2px; background: var(--accent); transform: rotate(45deg);
}

.bubble {
  position: relative; font-family: var(--kai); font-size: 1.02rem; line-height: 1.6;
  background: var(--surface); border: 1.5px solid var(--line-2); border-radius: 22px;
  padding: .6rem 1rem; color: var(--ink);
  box-shadow: var(--shadow);
}
.bubble::after, .bubble::before {
  content: ""; position: absolute; border-radius: 50%; background: var(--surface);
  border: 1.5px solid var(--line-2);
}
.bubble::after { width: .8rem; height: .8rem; left: 1.4rem; bottom: -1.05rem; }
.bubble::before { width: .45rem; height: .45rem; left: .9rem; bottom: -1.65rem; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  min-height: 2.25rem; padding: .35rem .85rem; border-radius: 10px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  font-size: .84rem; font-weight: 600; line-height: 1.2;
  transition: background-color .2s, border-color .2s, color .2s, transform .12s, box-shadow .2s;
  user-select: none; -webkit-user-select: none;
}
.btn:hover { border-color: var(--accent); color: var(--accent-strong); }
.btn:active { transform: translateY(1px) scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-3); }
.btn.sm { min-height: 1.9rem; padding: .22rem .6rem; font-size: .76rem; border-radius: 8px; }
.btn.on { background: var(--accent-tint); border-color: var(--accent); color: var(--accent-strong); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn .ico { width: 1rem; height: 1rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: .45rem; align-items: center; }
.row { display: flex; align-items: center; flex-wrap: wrap; gap: .6rem; }
.row.gap-s { gap: .4rem; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: .6rem; }

.seg {
  display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 11px;
  background: var(--surface-3); border: 1px solid var(--line);
}
.seg button {
  border: 0; background: transparent; border-radius: 8px; padding: .3rem .7rem;
  font-size: .8rem; font-weight: 600; color: var(--ink-2); min-height: 1.95rem;
  transition: background-color .2s, color .2s, box-shadow .2s;
}
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--surface); color: var(--accent-strong); box-shadow: 0 1px 3px rgba(20, 32, 52, .15); }

.chip {
  display: inline-flex; align-items: center; gap: .3rem;
  font-size: .72rem; font-weight: 700; padding: .12rem .5rem; border-radius: 99px;
  background: var(--surface-3); color: var(--ink-2); white-space: nowrap;
}
.chip.ok { background: var(--green-tint); color: var(--green); }
.chip.bad { background: var(--red-tint); color: var(--red); }
.chip.acc { background: var(--accent-tint); color: var(--accent-strong); }
.chip i.dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--c, currentColor); }

/* ---------- 读数面板 ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.8rem, 1fr)); gap: .5rem; }
.stat {
  padding: .5rem .7rem .55rem; border-radius: 11px; background: var(--surface-2);
  border: 1px solid var(--line); min-width: 0;
}
.stat .k { font-size: .7rem; color: var(--ink-3); letter-spacing: .04em; display: flex; gap: .3rem; align-items: baseline; white-space: nowrap; }
.stat .val {
  font-family: var(--num); font-size: 1.5rem; font-weight: 600; line-height: 1.15;
  color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stat .val small { font-size: .55em; color: var(--ink-3); margin-left: .15em; font-weight: 400; }
.stat.acc { background: var(--accent-tint); border-color: var(--accent); }
.stat.acc .val { color: var(--accent-strong); }
.stat.s1 .val { color: var(--s1); } .stat.s2 .val { color: var(--s2); }
.stat.s3 .val { color: var(--s3); } .stat.s4 .val { color: var(--s4); }
.stat.flash { animation: statFlash .6s var(--ease); }
@keyframes statFlash { 30% { background: var(--marker-soft); } }

/* ---------- 滑块 ---------- */
.slider { display: grid; grid-template-columns: auto minmax(0, 1fr) 3.4rem; align-items: center; gap: .6rem; }
.sliders { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: .15rem .8rem; }
.sliders > .slider { display: contents; }
.sliders output { min-width: 3.2rem; }
.slider label { font-size: .8rem; color: var(--ink-2); white-space: nowrap; }
.slider output { font-family: var(--num); font-weight: 600; font-size: .95rem; text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 1.8rem; background: transparent; margin: 0;
  --p: 50%;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: .42rem; border-radius: 99px;
  background: linear-gradient(90deg, var(--accent) var(--p), var(--surface-3) var(--p));
  border: 1px solid var(--line);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 1.3rem; height: 1.3rem; margin-top: -.5rem; border-radius: 50%;
  background: var(--surface); border: 2.5px solid var(--accent); box-shadow: 0 2px 6px rgba(0, 0, 0, .2);
  transition: transform .15s;
}
input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.15); }
input[type="range"]::-moz-range-track { height: .42rem; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line); }
input[type="range"]::-moz-range-progress { height: .42rem; border-radius: 99px; background: var(--accent); }
input[type="range"]::-moz-range-thumb { width: 1.2rem; height: 1.2rem; border-radius: 50%; background: var(--surface); border: 2.5px solid var(--accent); }

input[type="number"], input[type="text"], select {
  border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface);
  padding: .3rem .5rem; min-height: 2.1rem; font-size: .9rem; min-width: 0;
}
input[type="number"] { width: 5.2rem; font-family: var(--num); }
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }

/* ---------- 数据表 ---------- */
.table-wrap { overflow-x: auto; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); }
table.data { border-collapse: collapse; width: 100%; font-size: .84rem; font-variant-numeric: tabular-nums; }
table.data th, table.data td { padding: .38rem .55rem; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data th { background: var(--surface-3); color: var(--ink-2); font-weight: 700; font-size: .78rem; }
table.data tr:last-child td { border-bottom: 0; }
table.data td.num, table.data td .num { font-family: var(--num); }
table.data td.hi { background: var(--marker-soft); font-weight: 700; }
table.data td.good { color: var(--green); font-weight: 700; }
table.data td.bad { color: var(--red); font-weight: 700; }
table.data tr.win td { background: var(--accent-tint); }
table.data th:first-child, table.data td:first-child { text-align: left; }

/* ---------- 图形区 ---------- */
.fig { position: relative; flex: 1; min-height: 12rem; display: flex; align-items: center; justify-content: center; }
.fig > svg { width: 100%; height: 100%; display: block; overflow: visible; }
.fig.fixed > svg { height: auto; }
.fig-cap { font-size: .74rem; color: var(--ink-3); text-align: center; }

svg text { font-family: var(--sans); fill: var(--ink-2); }
svg .t-ink { fill: var(--ink); }
svg .t-m { font-family: var(--math); font-style: italic; fill: var(--ink); }
svg .t-num { font-family: var(--num); }
svg .t-acc { fill: var(--accent-strong); }
svg .axis { stroke: var(--ink-3); stroke-width: 1.4; fill: none; }
svg .gridline { stroke: var(--line); stroke-width: 1; fill: none; }
svg .gridline.dash { stroke-dasharray: 4 5; }
svg .line { stroke: var(--ink); stroke-width: 2.4; fill: none; stroke-linecap: round; }
svg .line.thin { stroke-width: 1.5; }
svg .line.muted { stroke: var(--ink-3); }
svg .line.acc { stroke: var(--accent); }
svg .line.dash { stroke-dasharray: 7 6; }
svg .guide { stroke: var(--ink-3); stroke-width: 1.2; stroke-dasharray: 3 5; fill: none; }
svg .pt { fill: var(--ink); }
svg .pt-hollow { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
svg .bar { fill: var(--accent); }
svg .ink-fill { fill: var(--ink); }
svg .surface-fill { fill: var(--surface); }
svg .bg-fill { fill: var(--surface-2); }

/* 可拖动手柄 */
.handle { cursor: grab; touch-action: none; }
.handle:active { cursor: grabbing; }
.handle .halo { fill: var(--accent); opacity: .18; transform-box: fill-box; transform-origin: center; animation: halo 2.2s ease-in-out infinite; }
.handle .knob { fill: var(--surface); stroke: var(--accent); stroke-width: 3; transition: r .15s; }
.handle .core { fill: var(--accent); }
.handle.dragging .halo { animation: none; opacity: .3; }
.handle.quiet .halo { animation: none; opacity: 0; }
@keyframes halo { 0%, 100% { transform: scale(.75); opacity: .25; } 50% { transform: scale(1.25); opacity: .06; } }

/* ---------- 证明书写 ---------- */
.proof { display: flex; flex-direction: column; gap: .15rem; font-size: 1rem; }
.proof-head { display: grid; grid-template-columns: 3.3rem minmax(0, 1fr); gap: .25rem .4rem; margin-bottom: .45rem; }
.proof-head b { color: var(--accent-strong); }
.pline {
  display: grid; grid-template-columns: 1.5rem minmax(0, 1fr) auto; align-items: baseline; gap: .5rem;
  padding: .28rem .55rem; border-radius: 9px; line-height: 1.55;
  transition: background-color .35s, opacity .45s var(--ease), transform .45s var(--ease), filter .45s;
}
.pline .sym { font-weight: 700; color: var(--accent-strong); font-size: 1.05em; text-align: center; }
.pline .why { color: var(--ink-3); font-size: .86em; white-space: nowrap; }
.pline .why::before { content: "（"; }
.pline .why::after { content: "）"; }
.pline.now { background: var(--marker-soft); }
.pline.done .why { color: var(--accent-strong); }
.proof.blanks .why .w { color: transparent; background: var(--surface-3); border-bottom: 2px dashed var(--line-2); border-radius: 4px; cursor: pointer; }
.proof.blanks .why .w.show { color: var(--accent-strong); background: transparent; border-bottom-color: transparent; }
.proof-label { font-weight: 700; color: var(--ink); margin: .3rem 0 .15rem; }

/* ---------- 测验 ---------- */
.quiz { display: flex; flex-direction: column; gap: .7rem; }
.q-card { display: flex; flex-direction: column; gap: .6rem; }
.q-stem { font-size: 1.02rem; line-height: 1.7; }
.q-stem .qn { display: inline-grid; place-items: center; min-width: 1.7rem; height: 1.7rem; margin-right: .45rem; border-radius: 7px; background: var(--accent); color: var(--on-accent); font-family: var(--num); font-weight: 700; font-size: .85rem; vertical-align: .1em; }
.q-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .5rem; }
.q-opt {
  display: flex; gap: .55rem; align-items: baseline; text-align: left; line-height: 1.5;
  padding: .55rem .75rem; border-radius: 11px; border: 1.5px solid var(--line-2); background: var(--surface);
  transition: border-color .2s, background-color .2s, transform .15s;
}
.q-opt:hover { border-color: var(--accent); }
.q-opt .lt { flex: none; font-family: var(--num); font-weight: 700; color: var(--ink-3); }
.q-opt.right { border-color: var(--green); background: var(--green-tint); }
.q-opt.right .lt { color: var(--green); }
.q-opt.wrong { border-color: var(--red); background: var(--red-tint); animation: shake .4s; }
.q-opt.wrong .lt { color: var(--red); }
.q-opt[disabled] { cursor: default; }
@keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
.q-explain { font-size: .88rem; line-height: 1.7; padding: .6rem .8rem; border-radius: 10px; background: var(--surface-2); border: 1px dashed var(--line-2); }
.q-explain b { color: var(--accent-strong); }
.q-nav { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.q-dots { display: flex; gap: .3rem; flex-wrap: wrap; }
.q-dots button { width: 1.9rem; height: 1.9rem; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); font-family: var(--num); font-size: .8rem; padding: 0; }
.q-dots button.cur { border-color: var(--accent); color: var(--accent-strong); font-weight: 700; box-shadow: 0 0 0 2px var(--accent-tint); }
.q-dots button.ok { background: var(--green-tint); border-color: var(--green); color: var(--green); }
.q-dots button.no { background: var(--red-tint); border-color: var(--red); color: var(--red); }
.score { font-family: var(--num); font-weight: 700; }

/* ---------- 揭示卡 / 翻转卡 ---------- */
.reveal-btn { align-self: flex-start; }
.answer { border-left: 0; padding: .6rem .8rem; border-radius: 10px; background: var(--green-tint); color: var(--ink); line-height: 1.7; }
.answer b.ok { color: var(--green); }
.flip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); gap: .7rem; }
.flip { position: relative; min-height: 7.2rem; perspective: 900px; border: 0; padding: 0; background: transparent; text-align: left; }
.flip-in { position: relative; width: 100%; height: 100%; min-height: 7.2rem; transition: transform .7s var(--ease); transform-style: preserve-3d; }
.flip.on .flip-in { transform: rotateY(180deg); }
.flip-face {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 13px; padding: .8rem .95rem; display: flex; flex-direction: column; justify-content: center; gap: .3rem;
  border: 1px solid var(--line-2); background: var(--surface); box-shadow: var(--shadow);
}
.flip-face.back { transform: rotateY(180deg); background: var(--accent-tint); border-color: var(--accent); }
.flip-face .nm { font-size: 1.2rem; font-weight: 800; }
.flip-face .hint { font-size: .72rem; color: var(--ink-3); }

/* ---------- 分类游戏 ---------- */
.sorter { display: flex; flex-direction: column; gap: .8rem; }
.sort-pool { display: flex; flex-wrap: wrap; gap: .5rem; min-height: 3rem; }
.sort-card {
  display: inline-flex; align-items: center; gap: .45rem; padding: .45rem .75rem; border-radius: 11px;
  border: 1.5px solid var(--line-2); background: var(--surface); box-shadow: var(--shadow);
  font-size: .92rem; line-height: 1.45; text-align: left;
  transition: transform .35s var(--ease), border-color .2s, background-color .2s, opacity .3s;
}
.sort-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.sort-card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
.sort-card.ok { border-color: var(--green); background: var(--green-tint); }
.sort-card.no { border-color: var(--red); background: var(--red-tint); animation: shake .4s; }
.sort-bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: .7rem; }
.sort-bin {
  border: 2px dashed var(--line-2); border-radius: 14px; padding: .6rem; min-height: 7rem;
  display: flex; flex-direction: column; gap: .4rem; background: var(--surface-2);
  transition: border-color .2s, background-color .2s;
}
.sort-bin.hot { border-color: var(--accent); background: var(--accent-tint); }
.sort-bin > b { font-size: .86rem; display: flex; justify-content: space-between; }
.sort-bin .sort-card { box-shadow: none; }

/* ---------- 其他 ---------- */
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .3rem .8rem; font-size: .9rem; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: .4rem .9rem; font-size: .76rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: .35rem; }
.legend i { width: .8rem; height: .8rem; border-radius: 3px; background: var(--c); }
.legend i.round { border-radius: 50%; }
.divider { height: 1px; background: var(--line); margin: .2rem 0; }
.callout-num { font-family: var(--num); font-size: 2.3rem; font-weight: 700; line-height: 1; color: var(--accent-strong); }
.tabs { display: flex; gap: .3rem; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line-2); background: var(--surface); padding: .3rem .75rem; border-radius: 99px; font-size: .8rem; font-weight: 600; color: var(--ink-2); }
.tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

@media (max-width: 900px) {
  .slide-inner { padding: .8rem 1rem 1.2rem; gap: .8rem; }
  .layout-split, .layout-split.even, .layout-split.text-wide, .layout-split.lab-wide { grid-template-columns: minmax(0, 1fr); }
  .title-row h2 { font-size: 1.35rem; }
  .panel.lab { min-height: 16rem; }
  .fig { min-height: 15rem; }
  .col.scroll { overflow: visible; }
}

/* ---- styles/slides.css ---- */
/* ============================================================
   数据与证明互动课堂 · 各页专用样式
   ============================================================ */

/* ---------- 封面 ---------- */
.slide-cover .slide-inner { max-width: 100rem; }
.slide-cover .slide-body { display: flex; }
.cover {
  display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 2rem;
  align-items: center; margin: auto 0; width: 100%;
}
.cover-main { display: flex; flex-direction: column; gap: .7rem; min-width: 0; }
.cover-kicker { font-size: .8rem; letter-spacing: .22em; color: var(--ink-3); }
.cover-h1 {
  font-size: 4.3rem; font-weight: 900; letter-spacing: .04em; line-height: 1.05;
  display: flex; align-items: baseline; gap: .1em; color: var(--ink);
}
.cover-h1 span:first-child { color: var(--c6); }
.cover-h1 span:last-child { color: var(--c7); }
.cover-h1 .amp { font-family: var(--kai); font-weight: 400; font-size: .6em; color: var(--ink-3); padding: 0 .08em; }
.cover-sub { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; font-size: 1.05rem; color: var(--ink-2); }
.cover-sub b { font-size: .8rem; padding: .1rem .5rem; border-radius: 6px; color: #fff; }
.cover-sub .c6t { background: var(--c6); }
.cover-sub .c7t { background: var(--c7); }
.cover-sub i { width: 1px; height: 1em; background: var(--line-2); margin: 0 .5rem; }
.cover-lead { font-size: 1rem; color: var(--ink-2); max-width: 34em; line-height: 1.75; }
.cover-actions { margin-top: .3rem; }
.btn.big { min-height: 2.8rem; padding: .5rem 1.2rem; font-size: .95rem; border-radius: 12px; }
.cover-hero { min-height: 13rem; max-height: 21rem; margin-top: .4rem; }

.cover-side { display: flex; flex-direction: column; gap: .9rem; min-width: 0; }
.ch-card {
  border-radius: 18px; padding: 1rem 1.1rem 1rem; background: var(--surface);
  border: 1px solid var(--line); box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.ch-card::after {
  content: attr(data-no); position: absolute; right: .8rem; top: -1.9rem; z-index: 0;
  font-family: var(--num); font-size: 6.2rem; font-weight: 800; line-height: 1;
  color: var(--accent-tint); pointer-events: none;
}
.ch-card > * { position: relative; z-index: 1; }
.ch-card header { display: flex; align-items: baseline; gap: .6rem; margin-bottom: .5rem; }
.ch-card .ch-no { font-size: .74rem; font-weight: 800; letter-spacing: .14em; color: var(--accent); }
.ch-card h3 { font-size: 1.35rem; font-weight: 800; }
.sec-list { list-style: none; display: flex; flex-direction: column; gap: .2rem; }
.sec-list button {
  width: 100%; display: grid; grid-template-columns: 3.1rem minmax(0, 1fr) auto; align-items: baseline; gap: .4rem;
  border: 0; background: transparent; border-radius: 10px; padding: .42rem .55rem; text-align: left;
  transition: background-color .2s;
}
.sec-list button:hover { background: var(--accent-tint); }
.sec-list b { font-family: var(--num); color: var(--accent-strong); font-size: .92rem; }
.sec-list span { font-weight: 600; font-size: .95rem; }
.sec-list small { color: var(--ink-3); font-size: .72rem; }
.ch-keys { margin-top: .55rem; font-size: .74rem; color: var(--ink-3); line-height: 1.7; }
.cover-tips { display: flex; flex-direction: column; gap: .4rem; font-size: .76rem; color: var(--ink-2); padding: .2rem .3rem; }
.cover-tips > div { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem; }
.cover-tips span { margin-right: .5rem; }

/* ---------- 章首页 ---------- */
.chapter-hero { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 2rem; align-items: center; width: 100%; max-width: 88rem; }
.chapter-hero .big-no { font-size: .95rem; font-weight: 800; letter-spacing: .3em; color: var(--accent); }
.chapter-hero h1 { font-size: 3.6rem; font-weight: 900; letter-spacing: .06em; margin: .2rem 0 .8rem; }
.chapter-hero .intro { font-size: 1.02rem; line-height: 1.85; color: var(--ink-2); max-width: 32em; }
.chapter-hero .qs { margin-top: 1rem; }
.chapter-hero .qs b { display: block; font-size: .8rem; letter-spacing: .1em; color: var(--ink-3); margin-bottom: .3rem; }
.chapter-hero .qs li { font-family: var(--kai); font-size: 1.08rem; }
.chapter-hero .fig { min-height: 18rem; }
.sec-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .6rem; margin-top: 1.1rem; }
.sec-card {
  display: flex; flex-direction: column; gap: .15rem; text-align: left; padding: .7rem .8rem;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow);
  transition: transform .2s var(--ease), border-color .2s;
}
.sec-card:hover { transform: translateY(-2px); border-color: var(--accent); }
.sec-card b { font-family: var(--num); color: var(--accent); font-size: .9rem; }
.sec-card span { font-weight: 700; }
.sec-card small { color: var(--ink-3); font-size: .72rem; line-height: 1.5; }

/* ---------- 第六章 ---------- */
.shoot-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: .6rem; flex: 1; min-height: 0; }
.shoot-cell { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .45rem .5rem .3rem; }
.shoot-cell .nm { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: .88rem; padding: 0 .3rem; }
.shoot-cell .fig { min-height: 6rem; }
.shoot-cell .tag-s { font-size: .72rem; font-weight: 600; color: var(--ink-3); }
.shoot-cell .tag-s b { font-family: var(--num); color: var(--ink); font-size: .95rem; }

.formula-card { padding: .7rem .9rem; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.formula-card .formula { font-size: 1.25rem; }
.live-formula { font-family: var(--math); font-size: 1.05rem; line-height: 2; text-align: center; overflow-x: auto; }
.live-formula .cn { font-family: var(--sans); }

.weights { display: flex; flex-direction: column; gap: .35rem; }
.wbar { display: flex; height: 1.6rem; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.wbar span { display: grid; place-items: center; font-size: .7rem; color: #fff; font-weight: 700; transition: flex-grow .4s var(--ease); min-width: 0; overflow: hidden; white-space: nowrap; }

.rank-list { display: flex; flex-direction: column; gap: .4rem; }
.rank-row { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr) 3.8rem; align-items: center; gap: .6rem; }
.rank-row .nm { font-weight: 800; }
.rank-row .track { height: 1.35rem; border-radius: 7px; background: var(--surface-3); position: relative; overflow: hidden; }
.rank-row .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; transition: width .6s var(--ease), background-color .3s; }
.rank-row .sc { font-family: var(--num); font-weight: 700; font-size: 1.05rem; text-align: right; }
.rank-row.win .nm::after {
  content: "最高"; display: inline-block; margin-left: .3rem; padding: .02rem .35rem; border-radius: 5px;
  font-size: .62rem; font-weight: 800; vertical-align: .15em; background: var(--marker); color: #3A2C00;
}
.rank-row.win .sc { color: var(--accent-strong); }
.dot-c { display: inline-block; width: .72rem; height: .72rem; border-radius: 50%; background: var(--c); margin-right: .35rem; vertical-align: -.04em; }
.practice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.4rem 1.2rem; align-content: start; }
.practice-grid > :last-child:nth-child(odd) { grid-column: 1 / -1; }
.practice-grid .box { display: flex; flex-direction: column; gap: .6rem; }
.practice-grid .box > .tag { font-family: var(--num); letter-spacing: 0; }
@media (max-width: 900px) { .practice-grid { grid-template-columns: minmax(0, 1fr); } }

.dev-legend { display: flex; gap: .8rem; flex-wrap: wrap; font-size: .75rem; color: var(--ink-2); }

.group-table td { font-family: var(--num); }


/* 数据块 */
.tiles { display: flex; flex-wrap: wrap; gap: .45rem; align-content: flex-start; }
.tile {
  min-width: 3.1rem; height: 3.1rem; padding: 0 .5rem; border-radius: 11px;
  display: grid; place-items: center; border: 1.5px solid var(--line-2); background: var(--surface);
  font-family: var(--num); font-size: 1.3rem; font-weight: 600; color: var(--ink);
  transition: transform .25s var(--ease), border-color .2s, background-color .2s, opacity .35s;
}
button.tile:hover { transform: translateY(-2px); }
.tile.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
.tile.mode { background: var(--marker-soft); }
.tile.judge { height: auto; padding: .4rem .7rem; display: flex; flex-direction: column; align-items: center; gap: .1rem; }
.tile.judge small { font-family: var(--sans); font-size: .66rem; color: var(--ink-3); font-weight: 400; }
.tile.judge.extreme { border-color: var(--amber); }
.tile.judge.out { opacity: .32; text-decoration: line-through; transform: scale(.92); }


/* 问题下方的答案条 */
.ans {
  display: block; margin-top: .3rem; padding: .35rem .65rem; border-radius: 9px;
  background: var(--green-tint); color: var(--ink); font-size: .92em; line-height: 1.6;
}
table.small-t { font-size: .78rem; }
table.small-t th, table.small-t td { padding: .3rem .4rem; }

/* 对话 */
.talk { display: flex; flex-direction: column; gap: .45rem; }
.say { display: grid; grid-template-columns: 4.4rem minmax(0, 1fr); gap: .55rem; align-items: start; }
.say b {
  font-size: .76rem; text-align: center; padding: .28rem .2rem; border-radius: 8px;
  background: var(--surface-3); color: var(--ink-2); margin-top: .15rem;
}
.say span {
  position: relative; font-family: var(--kai); font-size: 1.02rem; line-height: 1.55;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 4px 14px 14px 14px;
  padding: .35rem .75rem;
}
.say.q b { background: var(--accent); color: var(--on-accent); }
.say.q span { border-color: var(--accent); background: var(--accent-tint); }

/* 三个统计量对比 */
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; }
.trio-card { padding: .7rem .8rem; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.trio-card b { display: block; font-size: 1rem; margin-bottom: .3rem; color: var(--accent-strong); }
.trio-card p { font-size: .84rem; line-height: 1.7; }

/* 数据卡片（中位数） */
.cards-row { display: flex; flex-wrap: wrap; gap: .5rem; min-height: 6.4rem; align-content: flex-start; }
.dcard {
  width: 4.8rem; height: 6rem; border-radius: 12px; display: grid; place-items: center;
  background: var(--surface); border: 1.5px solid var(--line-2); box-shadow: var(--shadow);
  font-size: 1.12rem; font-weight: 700; color: var(--ink);
  transition: background-color .3s, border-color .3s, transform .35s var(--ease), opacity .3s;
}
.dcard.mid { background: var(--accent); border-color: var(--accent); color: var(--on-accent); transform: translateY(-8px) scale(1.06); }
.dcard.side-l { background: var(--s1-tint); border-color: var(--s1); opacity: .85; }
.dcard.side-r { background: var(--s2-tint); border-color: var(--s2); opacity: .85; }
.med-note { min-height: 1.6em; font-size: .92rem; color: var(--ink-2); }
.med-note b { color: var(--accent-strong); font-size: 1.1em; }
@media (max-width: 900px) {
  .trio { grid-template-columns: minmax(0, 1fr); }
  .dcard { width: 3.9rem; height: 5rem; font-size: .95rem; }
}

/* ---------- 第七章 ---------- */
.illus-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; flex: 1; min-height: 0; }
.illus { display: flex; flex-direction: column; gap: .3rem; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: .55rem .7rem .6rem; min-height: 0; }
.illus .q { font-size: .86rem; font-weight: 600; }
.illus .fig { min-height: 8rem; }
.illus .ans { font-size: .8rem; color: var(--green); font-weight: 700; min-height: 1.3em; }

.prop-line { font-size: 1.1rem; line-height: 1.9; }
.cond { background: var(--s1-tint); border-bottom: 2.5px solid var(--s1); padding: 0 .15em; border-radius: 3px; }
.conc { background: var(--s2-tint); border-bottom: 2.5px solid var(--s2); padding: 0 .15em; border-radius: 3px; }
.if-word, .then-word { font-weight: 800; color: var(--ink); }

.tree-wrap { position: relative; flex: 1; min-height: 20rem; }
.fact-list { list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; counter-reset: f; }
.fact-list li {
  display: grid; grid-template-columns: 4.2rem minmax(0, 1fr); gap: .6rem; align-items: center;
  padding: .45rem .6rem; border-radius: 11px; background: var(--surface); border: 1px solid var(--line);
  font-size: .88rem; line-height: 1.5; counter-increment: f;
}
.fact-list li svg { width: 4.2rem; height: 2.8rem; }
.fact-list li.later { border-style: dashed; color: var(--ink-3); }

.timeline { list-style: none; display: flex; flex-direction: column; gap: .2rem; position: relative; padding-left: 1.4rem; }
.timeline::before { content: ""; position: absolute; left: .42rem; top: .4rem; bottom: .4rem; width: 2px; background: var(--line-2); }
.timeline li { position: relative; padding: .35rem 0 .35rem .3rem; line-height: 1.6; }
.timeline li::before { content: ""; position: absolute; left: -1.22rem; top: .8rem; width: .7rem; height: .7rem; border-radius: 50%; background: var(--surface); border: 2.5px solid var(--accent); }
.timeline .yr { font-family: var(--num); font-weight: 700; color: var(--accent-strong); margin-right: .4rem; }

@media (max-width: 1100px) {
  .cover { grid-template-columns: minmax(0, 1fr); gap: 1.2rem; }
  .cover-h1 { font-size: 3.2rem; }
  .chapter-hero { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .fact-list { grid-template-columns: minmax(0, 1fr); }
  .illus-grid, .shoot-grid { grid-template-columns: minmax(0, 1fr); }
  .chapter-hero h1 { font-size: 2.6rem; }
}
@media (max-width: 520px) {
  .cover-h1 { font-size: 2.6rem; }
}

</style>
</head>
<body>
<div class="app ch-0" id="app">
  <header class="topbar">
    <button class="icon-btn" id="btnToc" type="button" aria-label="打开目录" title="目录（T）" data-icon="menu"></button>
    <a class="brand" href="#home" aria-label="返回封面">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect x="3" y="17" width="5" height="11" rx="1.5"/><rect x="10.5" y="11" width="5" height="17" rx="1.5"/><path d="M19 28 L29 8" /><path d="M19 20 L29 20" /><circle cx="24" cy="14" r="1.6"/></svg>
      </span>
      <span class="brand-text"><b>数据与证明</b><small>八年级上册 · 第六、七章</small></span>
    </a>
    <nav class="crumbs" id="crumbs" aria-label="当前位置"></nav>
    <div class="tools" role="toolbar" aria-label="教学工具">
      <div class="timer-chip" id="timerChip" hidden><span id="timerText">03:00</span></div>
      <button class="tool-btn" id="btnTimer" type="button" title="计时器" data-icon="timer"><span>计时</span></button>
      <button class="tool-btn" id="btnPen" type="button" title="画笔批注（P）" data-icon="pen"><span>画笔</span></button>
      <button class="tool-btn" id="btnFont" type="button" title="调整字号" data-icon="text"><span>字号</span></button>
      <button class="tool-btn" id="btnTheme" type="button" title="切换浅色 / 深色" data-icon="theme"><span>主题</span></button>
      <button class="tool-btn" id="btnFull" type="button" title="全屏（F）" data-icon="full"><span>全屏</span></button>
    </div>
  </header>

  <main class="stage" id="stage" aria-live="polite"></main>

  <footer class="dock">
    <button class="nav-btn prev" id="btnPrev" type="button" aria-label="上一步" data-icon="left"><span>上一步</span></button>
    <div class="progress" id="progress" aria-label="课件进度"></div>
    <div class="dock-info"><span class="step-info" id="stepInfo"></span><span class="page-info" id="pageInfo"></span></div>
    <button class="nav-btn next" id="btnNext" type="button" aria-label="下一步" data-icon="right" data-icon-after><span>下一步</span></button>
  </footer>

  <aside class="toc" id="toc" aria-label="目录" aria-hidden="true">
    <div class="toc-head">
      <b>目录</b>
      <button class="icon-btn" id="btnTocClose" type="button" aria-label="关闭目录" data-icon="close"></button>
    </div>
    <div class="toc-body" id="tocBody"></div>
    <div class="toc-foot">
      <p><kbd>←</kbd><kbd>→</kbd> 上一步 / 下一步　<kbd>T</kbd> 目录　<kbd>P</kbd> 画笔　<kbd>F</kbd> 全屏</p>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="popover" id="fontPop" hidden>
    <b>字号</b>
    <div class="seg">
      <button type="button" data-fs="0.88">小</button>
      <button type="button" data-fs="1">标准</button>
      <button type="button" data-fs="1.12">大</button>
      <button type="button" data-fs="1.25">特大</button>
    </div>
    <p class="muted">投影到大屏时可选"大"或"特大"。</p>
  </div>

  <div class="popover" id="timerPop" hidden>
    <b>课堂计时</b>
    <div class="seg" id="timerPresets">
      <button type="button" data-min="1">1 分</button>
      <button type="button" data-min="2">2 分</button>
      <button type="button" data-min="3">3 分</button>

  /* ---------------- 概念：中位数（排序找中间） ---------------- */
  M.slide({
    id: 's621-median', sec: '6.2', lesson: L, kind: '概念', title: '中位数：排好队，找中间', layout: 'split',
    html: function () {
      return '' +
        '<div class="col scroll">' +
        '  <p>职员C 的工资 4 800 元恰好居于所有员工工资的“正中间”：有 4 人的工资比他高，有 4 人的工资比他低。我们称它为中位数。</p>' +
        '  <div class="box def"><span class="tag">中位数</span><p>一般地，<i class="v">n</i> 个数据按大小顺序排列，处于<span class="hl">最中间位置</span>的一个数据（或最中间两个数据的平均数）叫作这组数据的中位数。</p></div>' +
        '  <ul class="dots">' +
        '    <li>先<b>排序</b>，再找中间。</li>' +
        '    <li><i class="v">n</i> 为奇数：中位数是第 ' + M.frac('<i class="v">n</i> + 1', '2') + ' 个数据。</li>' +
        '    <li><i class="v">n</i> 为偶数：中位数是第 ' + M.frac('<i class="v">n</i>', '2') + ' 个与第 ' + M.frac('<i class="v">n</i>', '2') + ' + 1 个数据的平均数。</li>' +
        '  </ul>' +
        '  <div class="box ex" data-step="1"><span class="tag">例</span><p class="small">8 名同学的身高（单位：m）：1.52，1.55，1.58，1.60，1.63，1.66，1.70，1.72。<br>中位数是 ' + M.frac('1', '2') + '(1.60 + 1.63) = <b>1.615</b>（m）。</p></div>' +
        '</div>' +
        '<div class="col">' +
        '  <div class="panel lab">' +
        '    <div class="panel-title">数据卡片<span class="hint" id="medHint">先排序，再找中间</span></div>' +
        '    <div class="cards-row" id="medCards"></div>' +
        '    <div class="med-note" id="medNote"></div>' +
        '    <div class="btn-row"><button type="button" class="btn primary" id="mSort">' + M.icon('sort') + '排序</button><button type="button" class="btn" id="mFind">' + M.icon('eye') + '找中间</button>' +
        '      <button type="button" class="btn" id="mAdd">' + M.icon('plus') + '添加一个</button><button type="button" class="btn" id="mDel">' + M.icon('minus') + '去掉一个</button><button type="button" class="btn ghost" id="mShuffle">' + M.icon('shuffle') + '打乱</button></div>' +
        '    <div id="medStats"></div>' +

    },
    mount: function (body, api) {
      var pool = [5200, 4800, 15000, 4600, 2400, 7800, 4600, 5000, 4600, 3900, 6300, 5500];
      var vals = pool.slice(0, 9);
      var host = M.$('#medCards', body), note = M.$('#medNote', body);
      var cards = [];
      var sorted = false, found = false;
      var stats = M.W.stats(M.$('#medStats', body), [
        { key: 'n', label: '数据个数 <i class="v">n</i>', d: 0 },
        { key: 'pos', label: '中间位置', d: 0 },
        { key: 'med', label: '中位数', cls: 'acc', d: 1 }
      ]);
      function build() {
        host.innerHTML = '';

          c._v = v;
          host.appendChild(c);

        });
      }
      function flip(orderFn) {
        var first = cards.map(function (c) { return c.getBoundingClientRect(); });
        var order = orderFn(cards.slice());
        order.forEach(function (c) { host.appendChild(c); });
        cards.forEach(function (c, i) {

        });

      });
      M.$('#mAdd', body).addEventListener('click', function () {

        var c = M.el('div', { 'class': 'dcard new', html: '<span class="num">' + v + '</span>' });

      });
      build(); refresh();
      return {
        onStep: function (n) { if (n >= 1) { vals = [1.63, 1.52, 1.70, 1.58, 1.72, 1.55, 1.66, 1.60]; build(); sorted = false; clearMarks(); refresh(); setTimeout(find, 300); } },
        enter: function () { if (api.step() === 0) { vals = pool.slice(0, 9); build(); sorted = false; clearMarks(); refresh(); } }

    }
  });

  function togglePop(k, btn) {
    var p = pops[k];
    var show = p.hidden;
    closePops(k);
    p.hidden = !show;
    if (show) {
      var r = btn.getBoundingClientRect();
      p.style.top = (r.bottom + 8) + 'px';
      p.style.right = Math.max(12, window.innerWidth - r.right) + 'px';
    }
    btn.classList.toggle('on', show || (k === 'timer' && Timer.running));
  }
  document.addEventListener('pointerdown', function (e) {
    var inside = e.target.closest && (e.target.closest('.popover') || e.target.closest('#btnFont') || e.target.closest('#btnTimer'));
    if (!inside) closePops();
  });

  /* 字号 */
  function setFs(v) {
    document.documentElement.style.setProperty('--fs', v);
    $$('#fontPop [data-fs]').forEach(function (b) { b.classList.toggle('on', +b.getAttribute('data-fs') === +v); });
    M.store.set('fs', v);
  }
  $('#btnFont').addEventListener('click', function () { togglePop('font', this); });
  $$('#fontPop [data-fs]').forEach(function (b) { b.addEventListener('click', function () { setFs(+b.getAttribute('data-fs')); }); });
  setFs(M.store.get('fs', 1));

  /* 主题 */
  function effectiveDark() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t) return t === 'dark';
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  $('#btnTheme').addEventListener('click', function () {
    var dark = !effectiveDark();
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    M.store.set('theme', dark ? 'dark' : 'light');
    M.toast(dark ? '已切换为深色主题' : '已切换为浅色主题', 1400);
  });
  var savedTheme = M.store.get('theme', null);
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

  /* 全屏 */
  function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function toggleFull() {
    try {
      if (isFull()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) { M.toast('当前浏览器不支持全屏，可按 F11'); return; }
      var r = req.call(el);
      if (r && r.catch) r.catch(function () { M.toast('当前环境不允许全屏，可按 F11'); });
    } catch (e) { M.toast('当前环境不允许全屏，可按 F11'); }
  }
  function syncFull() {
    var b = $('#btnFull');
    b.querySelector('svg').outerHTML = M.icon(isFull() ? 'exitfull' : 'full');
    b.querySelector('span').textContent = isFull() ? '退出全屏' : '全屏';
  }
  $('#btnFull').addEventListener('click', toggleFull);
  document.addEventListener('fullscreenchange', syncFull);
  document.addEventListener('webkitfullscreenchange', syncFull);

  /* ---------- 计时器 ---------- */
  var Timer = { total: 180, left: 180, running: false, id: 0 };
  function fmtT(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
  function renderTimer() {
    $('#timerBig').textContent = fmtT(Timer.left);
    $('#timerText').textContent = fmtT(Timer.left);
    $('#timerStart').textContent = Timer.running ? '暂停' : (Timer.left < Timer.total && Timer.left > 0 ? '继续' : '开始');
    $('#timerChip').hidden = !(Timer.running || (Timer.left < Timer.total));
    $('#timerChip').classList.toggle('done', Timer.left === 0);
    $$('#timerPresets [data-min]').forEach(function (b) { b.classList.toggle('on', +b.getAttribute('data-min') * 60 === Timer.total); });
  }
  function tick() {
    Timer.left = Math.max(0, Timer.left - 1);
    if (Timer.left === 0) { stopTimer(); M.toast('⏰ 时间到！', 3000); }
    renderTimer();
  }
  function stopTimer() { Timer.running = false; clearInterval(Timer.id); $('#btnTimer').classList.remove('on'); }
  $('#btnTimer').addEventListener('click', function () { togglePop('timer', this); });
  $$('#timerPresets [data-min]').forEach(function (b) {
    b.addEventListener('click', function () { stopTimer(); Timer.total = Timer.left = +b.getAttribute('data-min') * 60; renderTimer(); });
  });
  $('#timerStart').addEventListener('click', function () {
    if (Timer.running) { stopTimer(); renderTimer(); return; }
    if (Timer.left === 0) Timer.left = Timer.total;
    Timer.running = true;
    Timer.id = setInterval(tick, 1000);
    $('#btnTimer').classList.add('on');
    renderTimer();
  });
  $('#timerReset').addEventListener('click', function () { stopTimer(); Timer.left = Timer.total; renderTimer(); });
  $('#timerChip').addEventListener('click', function () { togglePop('timer', $('#btnTimer')); });
  renderTimer();

  /* ---------- 画笔批注 ---------- */
  var Pen = (function () {
    var cv = $('#penCanvas'), bar = $('#penBar'), ctx = cv.getContext('2d');
    var strokes = {}, slideId = null, active = false, erasing = false;
    var color = '#E5402F', size = 6, hl = false, drawing = null;
    function list() { return strokes[slideId] || (strokes[slideId] = []); }
    function resize() {
      var dpr = window.devicePixelRatio || 1;
      cv.width = Math.round(window.innerWidth * dpr);
      cv.height = Math.round(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redraw();
    }
    function inkColor(c) { return c === 'ink' ? getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#17202B' : c; }
    function drawStroke(s) {
      var W = window.innerWidth, H = window.innerHeight, p = s.pts;
      if (!p.length) return;
      ctx.save();
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = inkColor(s.color);
      ctx.globalAlpha = s.hl ? 0.38 : 1;
      ctx.lineWidth = s.hl ? s.size * 3.2 : s.size;
      ctx.beginPath();
      ctx.moveTo(p[0][0] * W, p[0][1] * H);
      if (p.length === 1) ctx.lineTo(p[0][0] * W + 0.1, p[0][1] * H + 0.1);
      for (var i = 1; i < p.length - 1; i++) {
        var mx = (p[i][0] + p[i + 1][0]) / 2 * W, my = (p[i][1] + p[i + 1][1]) / 2 * H;
        ctx.quadraticCurveTo(p[i][0] * W, p[i][1] * H, mx, my);
      }
      if (p.length > 1) ctx.lineTo(p[p.length - 1][0] * W, p[p.length - 1][1] * H);
      ctx.stroke();
      ctx.restore();
    }
    function redraw() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      if (!slideId) return;
      list().forEach(drawStroke);
      if (drawing) drawStroke(drawing);
    }
    function sync() {
      var has = slideId && list().length > 0;
      cv.hidden = !(active || has);
      cv.classList.toggle('passive', !active);
      cv.classList.toggle('erasing', active && erasing);
      bar.hidden = !active;
      $('#btnPen').classList.toggle('on', active);
    }
    function eraseAt(x, y) {
      var W = window.innerWidth, H = window.innerHeight, L = list(), r = 18;
      for (var i = L.length - 1; i >= 0; i--) {
        var hit = L[i].pts.some(function (q) { return Math.hypot(q[0] * W - x, q[1] * H - y) < r + L[i].size; });
        if (hit) L.splice(i, 1);
      }
      redraw();
    }
    cv.addEventListener('pointerdown', function (e) {
      if (!active) return;
      e.preventDefault();
      cv.setPointerCapture(e.pointerId);
      if (erasing) { eraseAt(e.clientX, e.clientY); cv._erasing = true; return; }
      drawing = { color: color, size: size, hl: hl, pts: [[e.clientX / window.innerWidth, e.clientY / window.innerHeight]] };
      redraw();
    });
    cv.addEventListener('pointermove', function (e) {
      if (!active) return;
      if (cv._erasing) { eraseAt(e.clientX, e.clientY); return; }
      if (!drawing) return;
      var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      evs.forEach(function (ev) { drawing.pts.push([ev.clientX / window.innerWidth, ev.clientY / window.innerHeight]); });
      redraw();
    });
    function end() {
      cv._erasing = false;
      if (drawing) { list().push(drawing); drawing = null; redraw(); }
      sync();
    }
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
    $$('#penColors .swatch').forEach(function (b) {
      b.addEventListener('click', function () {
        $$('#penColors .swatch').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        color = b.getAttribute('data-color');
        hl = b.hasAttribute('data-hl');
        setErase(false);
      });
    });
    $$('#penSizes button').forEach(function (b) {
      b.addEventListener('click', function () {
        $$('#penSizes button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        size = +b.getAttribute('data-size');
      });
    });
    function setErase(v) { erasing = v; $('#penEraser').classList.toggle('on', v); sync(); }
    $('#penEraser').addEventListener('click', function () { setErase(!erasing); });
    $('#penUndo').addEventListener('click', function () { list().pop(); redraw(); sync(); });
    $('#penClear').addEventListener('click', function () { strokes[slideId] = []; redraw(); sync(); });
    $('#penClose').addEventListener('click', function () { toggle(false); });
    function toggle(v) {
      active = v == null ? !active : v;
      if (active) { closePops(); openToc(false); }
      if (!active) setErase(false);
      sync();
      if (active) M.toast('画笔已开启：可在任意位置书写，按 Esc 或“收起”退出', 2400);
    }
    $('#btnPen').addEventListener('click', function () { toggle(); });
    window.addEventListener('resize', resize);
    resize();
    return {
      toggle: toggle,
      isActive: function () { return active; },
      onSlide: function (id) { slideId = id; drawing = null; redraw(); sync(); }
    };
  })();

  /* ---------- 键盘 ---------- */
  document.addEventListener('keydown', function (e) {
    var t = e.target, tag = (t && t.tagName) || '';
    if (/INPUT|SELECT|TEXTAREA/.test(tag) || (t && t.isContentEditable)) {
      if (e.key === 'Escape') t.blur();
      return;
    }
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key;
    if (k === 'Escape') {
      if (Pen.isActive()) Pen.toggle(false);
      openToc(false); closePops();
      return;
    }
    if (toc.classList.contains('open')) return;
    if (k === 'ArrowRight' || k === 'PageDown' || (k === ' ' && tag !== 'BUTTON')) { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
    else if (k === 'Home') { e.preventDefault(); go(0, { dir: -1 }); }
    else if (k === 'End') { e.preventDefault(); go(slides.length - 1, { dir: 1 }); }
    else if (k === 't' || k === 'T') openToc();
    else if (k === 'p' || k === 'P') Pen.toggle();
    else if (k === 'f' || k === 'F') toggleFull();
  });
  btnNext.addEventListener('click', next);
  btnPrev.addEventListener('click', prev);

  /* ---------- 启动 ---------- */
  M.hydrateIcons(document);
  buildProgress();
  buildToc();
  function fromHash() {
    var id = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    return byId[id] ? id : null;
  }
  window.addEventListener('hashchange', function () {
    var id = fromHash();
    if (id && slides[cur] && slides[cur].id !== id) goId(id, { noHash: true });
  });
  var start = fromHash() || 'home';
  go(byId[start] ? byId[start].index : 0, { noHash: !fromHash() });
  // 空闲时预先构建下一页，翻页更顺
  var idle = window.requestIdleCallback || function (f) { return setTimeout(f, 300); };
  idle(function () { if (slides[cur + 1]) build(slides[cur + 1]); });
  var lastBuilt = cur;
  setInterval(function () {
    if (cur !== lastBuilt) { lastBuilt = cur; idle(function () { if (slides[cur + 1]) build(slides[cur + 1]); }); }
  }, 700);
})(window.M);

</script>
</body>
</html>
