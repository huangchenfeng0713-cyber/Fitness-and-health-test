<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数据与证明互动课堂</title>
<meta name="description" content="北师大版（2024）八年级上册数学 第六章《数据的分析》与第七章《命题与证明》互动教学课件">
<!-- build:css -->
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/slides.css">
<!-- /build:css -->
</head>
<body>
<div class="app ch-0" id="app">
  <header class="topbar">
    <button class="icon-btn" id="btnToc" type="button" aria-label="打开目录" title="目录（T）" data-icon="menu"></button>
    <a class="brand" href="#home" aria-label="返回封面">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect x="3" y="17" width="5" height="11" rx="1.5"/><rect x="10.5" y="11" width="5" height="17" rx="1.5"/><path d="M19 28 L29 8" /><path d="M19 20 L29 20" /><circle cx="24" cy="14" r="1.6"/></svg>
      </span>
      <span class="brand-text"><b>数据与证明</b><small>八年级上册 · 第六、七章</small></span>
    </a>
    <nav class="crumbs" id="crumbs" aria-label="当前位置"></nav>
    <div class="tools" role="toolbar" aria-label="教学工具">
      <div class="timer-chip" id="timerChip" hidden><span id="timerText">03:00</span></div>
      <button class="tool-btn" id="btnTimer" type="button" title="计时器" data-icon="timer"><span>计时</span></button>
      <button class="tool-btn" id="btnPen" type="button" title="画笔批注（P）" data-icon="pen"><span>画笔</span></button>
      <button class="tool-btn" id="btnFont" type="button" title="调整字号" data-icon="text"><span>字号</span></button>
      <button class="tool-btn" id="btnTheme" type="button" title="切换浅色 / 深色" data-icon="theme"><span>主题</span></button>
      <button class="tool-btn" id="btnFull" type="button" title="全屏（F）" data-icon="full"><span>全屏</span></button>
    </div>
  </header>

  <main class="stage" id="stage" aria-live="polite"></main>

  <footer class="dock">
    <button class="nav-btn prev" id="btnPrev" type="button" aria-label="上一步" data-icon="left"><span>上一步</span></button>
    <div class="progress" id="progress" aria-label="课件进度"></div>
    <div class="dock-info"><span class="step-info" id="stepInfo"></span><span class="page-info" id="pageInfo"></span></div>
    <button class="nav-btn next" id="btnNext" type="button" aria-label="下一步" data-icon="right" data-icon-after><span>下一步</span></button>
  </footer>

  <aside class="toc" id="toc" aria-label="目录" aria-hidden="true">
    <div class="toc-head">
      <b>目录</b>
      <button class="icon-btn" id="btnTocClose" type="button" aria-label="关闭目录" data-icon="close"></button>
    </div>
    <div class="toc-body" id="tocBody"></div>
    <div class="toc-foot">
      <p><kbd>←</kbd><kbd>→</kbd> 上一步 / 下一步　<kbd>T</kbd> 目录　<kbd>P</kbd> 画笔　<kbd>F</kbd> 全屏</p>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="popover" id="fontPop" hidden>
    <b>字号</b>
    <div class="seg">
      <button type="button" data-fs="0.88">小</button>
      <button type="button" data-fs="1">标准</button>
      <button type="button" data-fs="1.12">大</button>
      <button type="button" data-fs="1.25">特大</button>
    </div>
    <p class="muted">投影到大屏时可选"大"或"特大"。</p>
  </div>

  <div class="popover" id="timerPop" hidden>
    <b>课堂计时</b>
    <div class="seg" id="timerPresets">
      <button type="button" data-min="1">1 分</button>
      <button type="button" data-min="2">2 分</button>
      <button type="button" data-min="3">3 分</button>
      <button type="button" data-min="5">5 分</button>
    </div>
    <div class="timer-big" id="timerBig">03:00</div>
    <div class="row gap-s">
      <button class="btn primary" type="button" id="timerStart">开始</button>
      <button class="btn" type="button" id="timerReset">重置</button>
    </div>
  </div>

  <canvas class="pen-canvas" id="penCanvas" hidden></canvas>
  <div class="pen-bar" id="penBar" hidden>
    <div class="pen-colors" id="penColors">
      <button type="button" class="swatch on" data-color="#E5402F" style="--sw:#E5402F" aria-label="红色"></button>
      <button type="button" class="swatch" data-color="#2463EB" style="--sw:#2463EB" aria-label="蓝色"></button>
      <button type="button" class="swatch" data-color="#15A05A" style="--sw:#15A05A" aria-label="绿色"></button>
      <button type="button" class="swatch" data-color="#F4B400" style="--sw:#F4B400" aria-label="黄色荧光笔" data-hl="1"></button>
      <button type="button" class="swatch" data-color="ink" style="--sw:var(--ink)" aria-label="墨色"></button>
    </div>
    <div class="pen-sizes" id="penSizes">
      <button type="button" data-size="3" aria-label="细"><i style="--d:5px"></i></button>
      <button type="button" data-size="6" class="on" aria-label="中"><i style="--d:9px"></i></button>
      <button type="button" data-size="11" aria-label="粗"><i style="--d:14px"></i></button>
    </div>
    <button type="button" class="tool-btn" id="penEraser" data-icon="eraser"><span>橡皮</span></button>
    <button type="button" class="tool-btn" id="penUndo" data-icon="undo"><span>撤销</span></button>
    <button type="button" class="tool-btn" id="penClear" data-icon="trash"><span>清屏</span></button>
    <button type="button" class="tool-btn accent" id="penClose" data-icon="close"><span>收起</span></button>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>
<!-- build:js -->
<script src="js/core.js"></script>
<script src="js/charts.js"></script>
<script src="js/widgets.js"></script>
<script src="js/geom.js"></script>
<script src="js/slides/home.js"></script>
<script src="js/slides/ch6-intro.js"></script>
<script src="js/slides/ch6-1-1.js"></script>
<script src="js/slides/ch6-1-2.js"></script>
<script src="js/slides/ch6-1-3.js"></script>
<script src="js/slides/ch6-1-4.js"></script>
<script src="js/slides/ch6-2-1.js"></script>
<script src="js/slides/ch6-2-2.js"></script>
<script src="js/slides/ch6-3.js"></script>
<script src="js/slides/ch6-review.js"></script>
<script src="js/slides/ch7-intro.js"></script>
<script src="js/slides/ch7-1-1.js"></script>
<script src="js/slides/ch7-1-2.js"></script>
<script src="js/slides/ch7-1-3.js"></script>
<script src="js/slides/ch7-2-1.js"></script>
<script src="js/slides/ch7-2-2.js"></script>
<script src="js/slides/ch7-review.js"></script>
<script src="js/app.js"></script>
<!-- /build:js -->
</body>
</html>
