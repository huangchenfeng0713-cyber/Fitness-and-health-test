name: Deploy UI preview site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app from main
        uses: actions/checkout@v4
        with:
          repository: huangchenfeng0713-cyber/Fitness-and-health
          ref: main
          path: site

      - name: Apply UI preview patch
        run: |
          curl -fsSL https://raw.githubusercontent.com/huangchenfeng0713-cyber/Fitness-and-health/ui-preview/docs/ui-preview.patch -o ui-preview.patch
          git apply --directory=site ui-preview.patch
          test -n "$(git -C site diff --name-only)"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload test site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
