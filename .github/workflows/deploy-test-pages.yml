name: Deploy UI preview site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy source
        uses: actions/checkout@v4
        with:
          path: deploy-source

      - name: Checkout app from main
        uses: actions/checkout@v4
        with:
          repository: huangchenfeng0713-cyber/Fitness-and-health
          ref: main
          path: site

      - name: Apply UI preview patch if available
        shell: bash
        run: |
          if curl -fsSL https://raw.githubusercontent.com/huangchenfeng0713-cyber/Fitness-and-health/ui-preview/docs/ui-preview.patch -o ui-preview.patch; then
            git apply --directory=site ui-preview.patch || echo "UI preview patch no longer applies; deploying main unchanged."
          else
            echo "UI preview patch is unavailable; deploying main unchanged."
          fi

      - name: Add face score prototype
        run: |
          # 整目录复制：face-score 还带有同源的 MediaPipe 运行时与模型文件（vendor/）
          rm -rf site/face-score
          cp -R deploy-source/face-score site/face-score
          mkdir -p site/clothing-alert
          cp deploy-source/clothing-alert/index.html site/clothing-alert/index.html
          echo "deployed face-score files:"
          find site/face-score -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload test site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
